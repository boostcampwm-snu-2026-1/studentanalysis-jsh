services:
  - type: web
    name: studentanalysis-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile
